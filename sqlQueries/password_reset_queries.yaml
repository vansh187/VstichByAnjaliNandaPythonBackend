upsert_otp: |
  INSERT INTO VSTITCH_PASSWORD_RESET_OTPS (VstitchUserId, OtpHash, ExpiresAt, AttemptCount, ConsumedAt, created_by, updated_by)
  VALUES (%(vstitch_user_id)s, %(otp_hash)s, %(expires_at)s, 0, NULL, %(created_by)s, %(created_by)s)
  ON CONFLICT (VstitchUserId) DO UPDATE
    SET OtpHash = EXCLUDED.OtpHash,
        ExpiresAt = EXCLUDED.ExpiresAt,
        AttemptCount = 0,
        ConsumedAt = NULL,
        updated_by = EXCLUDED.updated_by,
        updated_date = CURRENT_TIMESTAMP
  RETURNING VstitchPasswordResetOtpId;

get_otp_for_user: |
  SELECT OtpHash, ExpiresAt, ConsumedAt, AttemptCount, updated_date
  FROM VSTITCH_PASSWORD_RESET_OTPS
  WHERE VstitchUserId = %s;

increment_otp_attempt_count: |
  -- Deliberately does NOT touch updated_date: _request_otp_unsafe's resend
  -- cooldown reads updated_date to mean "when was this code last (re)sent"
  -- - if a failed /confirm guess bumped it too, a few wrong-code attempts
  -- would keep re-arming the cooldown and could delay the account owner's
  -- own legitimate resend.
  UPDATE VSTITCH_PASSWORD_RESET_OTPS
  SET AttemptCount = AttemptCount + 1
  WHERE VstitchUserId = %s
  RETURNING AttemptCount;

consume_otp: |
  UPDATE VSTITCH_PASSWORD_RESET_OTPS
  SET ConsumedAt = CURRENT_TIMESTAMP,
      updated_by = %(updated_by)s,
      updated_date = CURRENT_TIMESTAMP
  WHERE VstitchUserId = %(vstitch_user_id)s;
