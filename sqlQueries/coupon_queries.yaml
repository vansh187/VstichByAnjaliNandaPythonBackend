insert_coupon: |
  INSERT INTO VSTITCH_COUPONS
      (CouponCode, DiscountType, DiscountValue, MinOrderAmount, MaxDiscountAmount, UsageLimit, ValidUntil, created_by)
  VALUES
      (%s, %s, %s, %s, %s, %s, %s, %s)
  RETURNING VstitchCouponId;

get_coupon_by_id: |
  SELECT VstitchCouponId, CouponCode, DiscountType, DiscountValue, MinOrderAmount, MaxDiscountAmount,
         UsageLimit, UsedCount, ValidFrom, ValidUntil, IsActive, created_date
  FROM VSTITCH_COUPONS
  WHERE VstitchCouponId = %s;

get_coupon_by_code: |
  -- Case-insensitive: CreateCouponRequestDTO/ApplyCouponRequestDTO both
  -- normalize to uppercase before this ever runs, but UPPER() here is a
  -- second, DB-level safety net against a code inserted some other way.
  SELECT VstitchCouponId, CouponCode, DiscountType, DiscountValue, MinOrderAmount, MaxDiscountAmount,
         UsageLimit, UsedCount, ValidFrom, ValidUntil, IsActive, created_date
  FROM VSTITCH_COUPONS
  WHERE UPPER(CouponCode) = UPPER(%s);

list_coupons_admin: |
  -- Plain list, newest first - the admin marketing screen shows every
  -- coupon (active and inactive) with no pagination, per the contract's
  -- own response shape (a bare JSON array).
  SELECT VstitchCouponId, CouponCode, DiscountType, DiscountValue, MinOrderAmount, MaxDiscountAmount,
         UsageLimit, UsedCount, ValidFrom, ValidUntil, IsActive, created_date
  FROM VSTITCH_COUPONS
  ORDER BY VstitchCouponId DESC;

list_active_coupons_for_amount: |
  -- Price-based selection for the checkout screen: active, the given cart
  -- total already meets MinOrderAmount (or there is none), currently
  -- inside its ValidFrom/ValidUntil window, and hasn't hit UsageLimit yet
  -- (or has none) - re-run fresh on every call, never cached client-side
  -- as the source of truth.
  SELECT VstitchCouponId, CouponCode, DiscountType, DiscountValue, MinOrderAmount, MaxDiscountAmount,
         UsageLimit, UsedCount, ValidFrom, ValidUntil, IsActive, created_date
  FROM VSTITCH_COUPONS
  WHERE IsActive = TRUE
    AND (MinOrderAmount IS NULL OR MinOrderAmount <= %(order_amount)s)
    AND ValidFrom <= CURRENT_TIMESTAMP
    AND (ValidUntil IS NULL OR ValidUntil >= CURRENT_TIMESTAMP)
    AND (UsageLimit IS NULL OR UsedCount < UsageLimit)
  ORDER BY MinOrderAmount DESC NULLS LAST, VstitchCouponId ASC;

update_coupon: |
  -- CouponCode is deliberately not updatable here - see
  -- UpdateCouponRequestDTO's comment.
  UPDATE VSTITCH_COUPONS
  SET DiscountType = %(discount_type)s,
      DiscountValue = %(discount_value)s,
      MinOrderAmount = %(min_order_amount)s,
      MaxDiscountAmount = %(max_discount_amount)s,
      UsageLimit = %(usage_limit)s,
      ValidUntil = %(valid_until)s,
      IsActive = %(is_active)s,
      updated_by = %(updated_by)s,
      updated_date = CURRENT_TIMESTAMP
  WHERE VstitchCouponId = %(vstitch_coupon_id)s
  RETURNING VstitchCouponId;

increment_used_count: |
  -- Not called anywhere yet - a ready-to-use hook for whenever the
  -- checkout/order-completion flow is wired to actually redeem a coupon
  -- (as opposed to POST /coupons/apply, which only previews/validates and
  -- must never consume a redemption on its own). See VSTITCH_COUPONS'
  -- schema doc for the full rationale.
  UPDATE VSTITCH_COUPONS
  SET UsedCount = UsedCount + 1,
      updated_by = %(updated_by)s,
      updated_date = CURRENT_TIMESTAMP
  WHERE VstitchCouponId = %(vstitch_coupon_id)s
    AND (UsageLimit IS NULL OR UsedCount < UsageLimit)
  RETURNING UsedCount;
