[pytest]
testpaths = tests
# Without this, `pytest` (unlike `python -m pytest`) never adds the repo
# root to sys.path, and none of these test files live under a package with
# an __init__.py that pytest's own rootdir-walk would find instead - every
# `from main import app` / `from vstitchServices... import ...` fails with
# ModuleNotFoundError before a single test can even run.
pythonpath = .
markers =
    integration: exercises the full HTTP API against a real Postgres database
